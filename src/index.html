<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <header class="header">
            <img src="./img/logo.svg" alt="#" class="header_logo">
        </header>
        <main class="container">
            <section class="nav">
                <h1 class="nav_text">FIND BEST EVENTS<br>AROUND THE WORLD</h1>
                <form class="nav_form">
                    <input type="text" class="nav_inp">
                    <button type="submit"></button>
                    <select class="nav_inp nav_select">
                        <option value="">Choose country</option>
                        <option value="US">United States</option>
                        <option value="CA">Canada</option>
                        <option value="MX">Mexico</option>
                        <option value="AU">Australia</option>
                        <option value="NZ">New Zealand</option>
                        <option value="GB">United Kingdom</option>
                        <option value="IE">Ireland</option>
                    </select>
                </form>
            </section>
            <section class="cards">
                <ul class="cards_list"><!--Сюди йдуть картки з івентами--></ul>
                <ul class="cards_pag"><!--Сюди йде пагінація--></ul>
            </section>
        </main>
        <footer class="container">
            <p class="footer_text">© 2021 | All Rights Reserved | Developed with ♥️ by GoIT Students</p>
        </footer>
        <script type="module" src="./js/main.js"></script>
    </body>
</html>
